version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc_siem_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/soc_siem
      - JWT_SECRET=local_jwt_secret_for_development
      - REFRESH_SECRET=local_refresh_secret
      - ACCESS_TOKEN_EXPIRY=1h
      - REFRESH_TOKEN_EXPIRY=7d
      - CORS_ORIGIN=*
    depends_on:
      - mongo
    networks:
      - soc_dashboard_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SOCKET_URL: /
    container_name: soc_siem_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - soc_dashboard_net

  mongo:
    image: mongo:6
    container_name: soc_siem_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - soc_dashboard_net

volumes:
  mongo_data:

networks:
  soc_dashboard_net:
    driver: bridge
